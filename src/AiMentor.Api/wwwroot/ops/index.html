<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AiMentor 运营指挥台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#task-list">跳到任务列表</a>
<header>
  <div><p class="eyebrow">AIMENTOR / OPERATIONS</p><h1>运营指挥台</h1></div>
  <div class="health"><span id="signal" aria-hidden="true"></span><span id="connection">正在连接</span></div>
</header>
<main>
  <aside aria-label="任务过滤">
    <h2>任务域</h2>
    <nav id="filters">
      <button class="active" data-type="">全部任务 <span id="count-all">0</span></button>
      <button data-type="approval">人工审批 <span id="count-approval">0</span></button>
      <button data-type="execution">结果不确定 <span id="count-execution">0</span></button>
      <button data-type="compensation">补偿处置 <span id="count-compensation">0</span></button>
      <button data-type="incident">故障运行 <span id="count-incident">0</span></button>
    </nav>
    <p class="hint">列表仅显示脱敏摘要。工具参数、审批理由和运行载荷不会发送到此页面。</p>
  </aside>
  <section class="queue" aria-labelledby="queue-title">
    <div class="section-head"><div><p class="eyebrow">ACTIVE QUEUE</p><h2 id="queue-title">待处理任务</h2></div><button id="refresh">刷新</button></div>
    <div id="status" role="status" aria-live="polite">正在加载任务</div>
    <div class="table-wrap">
      <table id="task-list"><thead><tr><th>类型</th><th>状态</th><th>截止时间</th><th>任务标识</th></tr></thead><tbody></tbody></table>
    </div>
    <button id="more" hidden>加载更多</button>
  </section>
  <aside class="detail" aria-labelledby="detail-title">
    <p class="eyebrow">TASK INSPECTOR</p><h2 id="detail-title">任务详情</h2>
    <div id="empty-detail">从队列选择一项任务。</div>
    <dl id="detail-data" hidden></dl>
    <div id="actions" hidden><label for="reason">裁决说明</label><textarea id="reason" maxlength="500" rows="4"></textarea><div class="action-row"></div></div>
    <div id="action-message" role="status" aria-live="polite"></div>
  </aside>
</main>
<script src="app.js" defer></script>
</body>
</html>
