apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aimentor.fullname" . }}-migrate
  labels:
    {{- include "aimentor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aimentor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "aimentor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - dotnet
            - /app/migrations/AiMentor.Migrations.dll
          env:
            - name: AIMENTOR_MIGRATIONS_ROOT
              value: /app/deploy/sql
            - name: AIMENTOR_RELEASE_ID
              value: {{ required "releaseId 必须是可审计的不可变发布标识" .Values.releaseId | quote }}
            - name: ConnectionStrings__WorkflowSqlServer
              valueFrom:
                secretKeyRef:
                  name: {{ include "aimentor.migrationExistingSecret" . }}
                  key: ConnectionStrings__WorkflowSqlServer
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
